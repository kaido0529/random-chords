<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Random Chords</title>

<style>
body {
  font-family: sans-serif;
  padding: 20px;
  max-width: 700px;
  margin: auto;
}

button {
  font-size: 18px;
  margin: 4px;
  padding: 10px 16px;
}

select, input {
  font-size: 18px;
}

#chordDisplay {
  font-size: 52px;
  margin: 20px 0;
}

.section {
  margin-top: 18px;
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.checkbox-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.slider {
  width: 260px;
}
</style>
</head>

<body>

<h1>Random Chords</h1>

<div id="chordDisplay">Cmaj7</div>

<label>
  <input type="checkbox" id="showChord" checked>
  コード名を表示する
</label>

<div class="section" id="manualControls">
  <div class="row">
    <select id="rootSelect"></select>
    <select id="chordSelect"></select>
  </div>

  <div class="row">
    <label><input type="checkbox" id="fixRoot"> Root固定</label>
    <label><input type="checkbox" id="fixChord"> コード種固定</label>
  </div>
</div>

<div class="section row">
  <button onclick="playSelectedChord()">Play</button>
  <button onclick="playRandomChordManual()">Random</button>
  <button onclick="stopAll()">Stop</button>
</div>

<div class="section row">
  <label><input type="checkbox" id="autoRandom"> Auto Random</label>
  <span>秒ごと:</span>
  <input class="slider" type="range" id="autoInterval" min="1" max="30" value="4">
  <span id="autoIntervalValue">4</span>
</div>

<div class="section row">
  <label><input type="checkbox" id="progressionOn"> +n半音進行</label>
  <span>n:</span>
  <input class="slider" type="range" id="degreeSlider" min="1" max="11" value="5">
  <span id="degreeValue">5</span>

  <span>秒ごと:</span>
  <input class="slider" type="range" id="progressionInterval" min="1" max="30" value="4">
  <span id="progressionIntervalValue">4</span>
</div>

<div class="section row">
  <label><input type="checkbox" id="metroOn"> Metronome</label>
  <span>BPM:</span>
  <input class="slider" type="range" id="bpmSlider" min="20" max="240" value="110">
  <span id="bpmValue">110</span>
</div>

<div class="section row">
  <button onclick="changeBpm(-10)">-10</button>
  <button onclick="changeBpm(-1)">-1</button>
  <button onclick="changeBpm(1)">+1</button>
  <button onclick="changeBpm(10)">+10</button>
</div>

<div class="section">
  <h3>Randomに含めるコード種</h3>
  <div id="chordCheckboxes" class="checkbox-grid"></div>
</div>
